name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  platform-test:
    name: ${{ matrix.os }} platform checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run platform execution regressions
        run: >-
          python -m pytest -q
          tests/test_review_fixes_v02.py
          tests/test_run_env.py
          tests/test_run_stream.py
          tests/test_repl_approval.py
          tests/test_network_errors.py
          tests/test_reinvent.py

  publish:
    name: Build and publish release assets
    needs: platform-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"])
          text = (root / "psyclaw" / "__init__.py").read_text(encoding="utf-8")
          expected = "v" + re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1)
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package {expected!r}")
      - name: Build platform packages
        run: python scripts/build_dist.py --index https://pypi.org/simple
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/psyclaw-${RELEASE_TAG#v}-py3-none-any.whl
          dist/psyclaw-${RELEASE_TAG#v}.tar.gz
          dist/psyclaw-macos-${RELEASE_TAG#v}.tar.gz
          dist/psyclaw-windows-${RELEASE_TAG#v}.zip
          dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "PsyClaw $RELEASE_TAG"
          --generate-notes
