name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  platform-test:
    name: Node 22 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        run: sh -n docs/install.sh
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'docs/install.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: pnpm check:branding
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  release:
    name: Pack and create GitHub release
    needs: platform-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected" || {
            echo "tag '$RELEASE_TAG' does not match package '$expected'" >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:branding
      - run: pnpm build
      - run: pnpm eval
      - run: pnpm eval:modules
      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p release
          artifact="$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          mv "$artifact" "release/$artifact"
          (cd release && sha256sum "$artifact" > SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            release/psyclaw-*.tgz \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "PsyClaw $RELEASE_TAG" \
            --prerelease \
            --generate-notes
