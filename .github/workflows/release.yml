name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  platform-test:
    name: Node 22 checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate POSIX installer
        if: runner.os != 'Windows'
        run: sh -n docs/install.sh
      - name: Validate PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'docs/install.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: pnpm check:branding
      - run: pnpm typecheck
      - run: pnpm build

  release:
    name: Publish npm package and create GitHub release
    needs: platform-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.5.1
      - name: Verify tag matches package version
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected" || {
            echo "tag '$RELEASE_TAG' does not match package '$expected'" >&2
            exit 1
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:branding
      - run: pnpm build
      - name: Pack npm artifact
        shell: bash
        run: |
          mkdir -p release
          artifact="$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].filename))")"
          mv "$artifact" "release/$artifact"
          (cd release && sha256sum "$artifact" > SHA256SUMS.txt)
      - name: Publish to npm with Trusted Publishing
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          tarball="./release/psyclaw-${version}.tgz"
          test -f "$tarball" || { echo "missing tarball: $tarball" >&2; exit 1; }
          if npm view "psyclaw@${version}" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "psyclaw@${version} already on registry; skipping publish"
          else
            npm publish "$tarball" --access public --registry=https://registry.npmjs.org/
          fi
      - name: Verify package is visible on npm
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 18); do
            if published="$(npm view "psyclaw@${version}" version --registry=https://registry.npmjs.org/ 2>/dev/null)" && [ "$published" = "$version" ]; then
              echo "verified psyclaw@${version} on registry"
              npm dist-tag ls psyclaw --registry=https://registry.npmjs.org/ || true
              # Ensure installable latest points at this release when it is the newest published.
              latest="$(npm view psyclaw version --registry=https://registry.npmjs.org/)"
              echo "registry latest=${latest}"
              exit 0
            fi
            echo "attempt ${attempt}: psyclaw@${version} not visible yet"
            sleep 10
          done
          echo "ERROR: psyclaw@${version} not found on https://registry.npmjs.org/ after publish" >&2
          exit 1
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release/psyclaw-*.tgz \
              release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest
          else
            gh release create "$RELEASE_TAG" \
              release/psyclaw-*.tgz \
              release/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "PsyClaw $RELEASE_TAG" \
              --latest \
              --generate-notes
          fi
