name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  platform-test:
    name: ${{ matrix.os }} platform checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install -e . pytest
      - name: Run platform execution regressions
        run: >-
          python -m pytest -q
          tests/test_review_fixes_v02.py
          tests/test_run_env.py
          tests/test_run_stream.py
          tests/test_repl_approval.py
          tests/test_network_errors.py
          tests/test_reinvent.py

  publish:
    name: Build and publish release assets
    needs: platform-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Verify tag matches package version
        shell: python
        run: |
          import os
          import psyclaw
          expected = "v" + psyclaw.__version__
          actual = os.environ["GITHUB_REF_NAME"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package {expected!r}")
      - name: Build platform packages
        run: python scripts/build_dist.py --index https://pypi.org/simple
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/psyclaw-${GITHUB_REF_NAME#v}-py3-none-any.whl
          dist/psyclaw-${GITHUB_REF_NAME#v}.tar.gz
          dist/psyclaw-macos-${GITHUB_REF_NAME#v}.tar.gz
          dist/psyclaw-windows-${GITHUB_REF_NAME#v}.zip
          dist/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY"
          --title "PsyClaw $GITHUB_REF_NAME"
          --generate-notes
